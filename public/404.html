<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Shibal - Not found</title>
		<meta name="description" content="Private URL shortener" />
		<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./assets/css/styles.css" />
	</head>
	<body>
		<main class="page-shell">
			<section class="panel not-found-panel" aria-labelledby="not-found-title">
				<div class="brand-stack">
					<img src="./assets/img/favicon.svg" alt="" class="brand-mark" />
					<div>
						<p class="brand-kicker">Shibal</p>
						<h1 id="not-found-title">Link not found</h1>
					</div>
				</div>
				<p class="not-found-copy">The short URL does not exist or is no longer available</p>
				<a class="button button-primary button-link" href="/">Back home</a>
			</section>
		</main>
	</body>
</html>
